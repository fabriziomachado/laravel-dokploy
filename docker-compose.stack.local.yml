version: '3.8'

# =============================================================================
# Docker Compose para TESTE LOCAL (sem Docker Swarm)
# =============================================================================
# Testa localmente o mesmo cenário do Dokploy, usando imagem pré-construída.
#
# Como usar:
#   1. Build: docker build -t fabriziomachado/laravel-dokploy:latest .
#      Ou pull: docker pull fabriziomachado/laravel-dokploy:latest
#   2. Configure .env (APP_KEY, DB_*, etc.)
#   3. docker-compose -f docker-compose.stack.local.yml up -d
#
# Para testar exatamente como no Dokploy: comente os volumes de config/entrypoint
# abaixo (usa só o que está na imagem).
#
# ⚠️ NÃO use este arquivo no Dokploy — use docker-compose.stack.yml
# =============================================================================

services:
  app:
    image: fabriziomachado/laravel-dokploy:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    networks:
      - dokploy-network
    volumes:
      - laravel-storage:/var/www/storage
      - laravel-bootstrap-cache:/var/www/bootstrap/cache
      # Opcional: monta config/entrypoint locais (editáveis sem rebuild).
      # Comente estas 3 linhas para testar exatamente como no Dokploy.
      - ./config/debugbar.php:/var/www/config/debugbar.php:ro
      - ./config/octane.php:/var/www/config/octane.php:ro
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL}
      - APP_LOCALE=${APP_LOCALE:-en}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE:-en}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=database
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CLIENT=${REDIS_CLIENT:-phpredis}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-redis}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
      - LOG_STACK=${LOG_STACK:-single,errorlog,stderr}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-${APP_NAME}}
      - OCTANE_SERVER=${OCTANE_SERVER:-swoole}
      - OCTANE_HTTPS=${OCTANE_HTTPS:-false}
      - DEBUGBAR_ENABLED=${DEBUGBAR_ENABLED:-true}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  database:
    image: mysql:8.0
    restart: unless-stopped
    networks:
      - dokploy-network
    volumes:
      - laravel-db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_connections=200
      --innodb_buffer_pool_size=512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - dokploy-network
    volumes:
      - laravel-redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  laravel-db:
  laravel-redis:
  laravel-storage:
  laravel-bootstrap-cache:

networks:
  dokploy-network:
