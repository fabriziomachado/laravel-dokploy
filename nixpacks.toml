# Nixpacks configuration for Laravel 12 + Inertia (React) + SSR
# Optimized for Dokploy Applications (Build Type: Nixpacks).
# Compatible with Coolify. See DEPLOY-NIXPACKS.md for full deploy guide.

[phases.setup]
# "..." extends provider (PHP) packages; we add supervisor for process management
nixPkgs = ["...", "python311Packages.supervisor"]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh",
    "mkdir -p /app/storage/logs /app/storage/framework/views /app/storage/framework/cache/data /app/storage/framework/sessions",
    "mkdir -p /app/database",
    "touch /app/database/database.sqlite",
    "chown -R www-data:www-data /app/storage /app/bootstrap/cache /app/database",
    "chmod -R ug+rwX /app/storage /app/bootstrap/cache /app/database",
    "chown -R www-data:www-data /app/public",
    "chmod -R ug+rwX /app/public",
    "cd /app",
    "# .env só no BUILD (nunca em runtime). Dokploy injeta vars no container; Laravel prioriza env > .env.",
    "cp .env.example .env",
    "sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env",
    "sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env",
    "sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env",
    "if [ -z \"${APP_KEY}\" ]; then php artisan key:generate --force --no-interaction; fi",
    "php artisan wayfinder:generate --with-form",
    "npm ci",
    "WAYFINDER_SKIP=1 npm run build:ssr",
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash
set -e

# Optional: wait for DB and run migrations (set DB_HOST in Dokploy env)
if [ -n "$DB_HOST" ]; then
    echo "Waiting for database..." >&2
    until php /app/artisan migrate:status > /dev/null 2>&1; do
        echo "Database not ready, retrying in 2s..." >&2
        sleep 2
    done
    [ "$APP_ENV" != "testing" ] && php /app/artisan migrate --force || true
fi

php /app/artisan config:clear || true
php /app/artisan route:clear || true
php /app/artisan view:clear || true
[ "$APP_ENV" != "testing" ] && (php /app/artisan config:cache && php /app/artisan route:cache && php /app/artisan view:cache) || true

chown -R www-data:www-data /app/storage /app/bootstrap/cache /app/database
chmod -R ug+rwX /app/storage /app/bootstrap/cache /app/database

# Nixpacks PHP provider injects prestart.mjs; transforms nginx template and writes /etc/nginx.conf
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf || true

# Fallback: if prestart is missing (e.g. custom Nixpacks), use static config
if [ ! -f /etc/nginx.conf ]; then
    cp /assets/nginx.template.conf /etc/nginx.conf
fi

exec supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
user=www-data
group=www-data
'''

"worker-inertia-ssr.conf" = '''
[program:worker-inertia-ssr]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec node /app/bootstrap/ssr/ssr.js'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stdout_logfile=/var/log/worker-inertia-ssr.log
stderr_logfile=/var/log/worker-inertia-ssr.log
user=www-data
group=www-data
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 60
php_admin_value[post_max_size] = 35M
php_admin_value[upload_max_filesize] = 30M
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )

        add_header X-Content-Type-Options "nosniff";

        client_max_body_size 35M;

        index index.php;

        charset utf-8;

        $if(NIXPACKS_PHP_FALLBACK_PATH) (
            location / {
                try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
            }
        ) else (
            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }
        )

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()

        location ~ \.php$ {
            fastcgi_buffer_size 8k;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;

            fastcgi_param PHP_VALUE "upload_max_filesize=30M \n post_max_size=35M";
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
