name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
      - dokploy-setup
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: fabriziomachado/laravel-dokploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # SHA completo do commit (melhor para rastreabilidade e Dokploy)
            type=sha,format=long
            # SHA curto (7 caracteres) para facilitar uso manual
            type=sha,format=short
            # Tag com branch + SHA (ex: main-abc123d)
            type=sha,prefix={{branch}}-
            # Tag com nome da branch (ex: main, dokploy-setup)
            type=ref,event=branch
            # Tag latest sempre aponta para a última imagem (independente da branch)
            type=raw,value=latest
            # Versão semântica (quando houver tag v*)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # PR tags (para testes)
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildcache é apenas para cache, não é uma tag de imagem
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}
